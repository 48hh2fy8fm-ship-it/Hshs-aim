name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Project File
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" -print -quit)

          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE..."
            unzip -o "$ZIP_FILE"
          fi

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build App
        shell: bash
        run: |
          set -o pipefail

          PROJ_PATH=$(find . -name "*.xcodeproj" -print -quit)

          if [ -z "$PROJ_PATH" ]; then
            echo "Error: No .xcodeproj found."
            exit 1
          fi

          echo "Found Project: $PROJ_PATH"

          xcodebuild -list -project "$PROJ_PATH"

          SCHEME_NAME=$(xcodebuild -list -project "$PROJ_PATH" 2>/dev/null \
            | sed -n '/Schemes:/,$p' \
            | sed -n '2p' \
            | xargs)

          if [ -z "$SCHEME_NAME" ]; then
            echo "Error: No shared scheme found."
            exit 1
          fi

          echo "Found Scheme: $SCHEME_NAME"

          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ALWAYS_SEARCH_USER_PATHS=NO

      - name: Package to IPA
        shell: bash
        run: |
          set -e

          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"

          APP_FILE=$(find "$APP_PATH" -maxdepth 1 -type d -name "*.app" -print -quit)

          if [ -z "$APP_FILE" ]; then
            echo "Error: No .app was produced by the build."
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_FILE" Payload/

          /usr/bin/zip -qry FloatingColor.ipa Payload

          if [ ! -s FloatingColor.ipa ]; then
            echo "Error: IPA file was not created."
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatingColor-IPA
          path: FloatingColor.ipa
          if-no-files-found: error
